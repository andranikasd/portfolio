<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Andranik Grigoryan — DevOps Engineer. Infrastructure, CI/CD, cloud, and automation." />
  <meta name="theme-color" content="#efe3c8" />
  <meta property="og:title" content="Andranik Grigoryan — DevOps Engineer" />
  <meta property="og:description" content="Building reliable infrastructure, streamlined CI/CD, and scalable cloud platforms." />
  <meta property="og:type" content="website" />
  <title>Andranik Grigoryan — DevOps Engineer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%239b2c1f'/%3E%3Ctext x='50' y='54' font-size='46' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle' dominant-baseline='central'%3EAG%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/map.css" />

  <!-- The module graph is deep and the config is needed before first paint;
       fetch them in parallel with the parser instead of waterfalling. -->
  <link rel="preload" href="assets/data/portfolio.json" as="fetch" crossorigin="anonymous" />
  <link rel="modulepreload" href="assets/js/main.js" />
  <link rel="modulepreload" href="assets/js/doc-view.js" />
  <link rel="modulepreload" href="assets/js/text.js" />
  <link rel="modulepreload" href="assets/js/map/map-view.js" />
  <link rel="modulepreload" href="assets/js/map/worldgen.js" />
  <link rel="modulepreload" href="assets/js/map/cartography.js" />
  <link rel="modulepreload" href="assets/js/map/ambience.js" />
  <link rel="modulepreload" href="assets/js/map/combat.js" />
  <link rel="modulepreload" href="assets/js/map/bestiary.js" />
  <link rel="modulepreload" href="assets/js/map/fog.js" />
  <link rel="modulepreload" href="assets/js/map/device.js" />
  <link rel="modulepreload" href="assets/js/map/rng.js" />
</head>
<body data-view="loading">

  <!-- ── VIEW SWITCH ───────────────────────────────────────── -->
  <div class="view-switch" role="group" aria-label="Choose how to browse this portfolio">
    <button type="button" class="view-switch__btn" data-goto="map" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="16" height="16" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/></svg>
      <span>Map</span>
    </button>
    <button type="button" class="view-switch__btn" data-goto="doc" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="16" height="16" aria-hidden="true"><path d="M5 3h9l5 5v13H5V3Z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
      <span>Document</span>
    </button>
  </div>

  <!-- ── MAP VIEW ──────────────────────────────────────────── -->
  <main class="map-view" id="map-view" aria-label="Campaign map">
    <canvas class="map-view__canvas" id="map-canvas"></canvas>

    <div class="map-rail">
    <div class="map-hud">
      <div class="map-hud__title">
        <h1 id="map-title">The Campaign</h1>
        <p id="map-subtitle"></p>
      </div>
      <ol class="map-hud__log" id="map-log" aria-label="Keeps on the map"></ol>
      <p class="map-hud__note" id="map-legend"></p>
    </div>

    <div class="map-status" aria-live="polite">
      <div class="map-status__row" id="map-party-row">
        <span class="map-status__label">Party</span>
        <span class="map-hp" id="map-hp" role="img" aria-label="Party strength"></span>
      </div>
      <div class="map-status__keep" id="map-keep" hidden>
        <div class="map-status__row">
          <span class="map-status__label">Keep integrity</span>
          <strong class="map-status__score" id="map-keep-value">0</strong>
        </div>
        <div class="keep-bar"><span id="map-keep-bar"></span></div>
      </div>
      <div class="map-status__row">
        <span class="map-status__label">Incidents resolved</span>
        <strong class="map-status__score" id="map-score">0</strong>
      </div>
      <div class="map-status__mission" id="map-mission" hidden></div>
      <ul class="tool-rack" id="map-tools" hidden aria-label="Tools"></ul>
    </div>
    </div>

    <p class="map-banner" id="map-banner" role="status"></p>
    <p class="map-hint" id="map-hint" role="status"></p>

    <button type="button" class="map-fire" id="map-fire" aria-label="Loose an arrow">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 21 20 4"/><path d="M14 4h6v6"/><path d="M3 21l1.5-5L9.5 17.5 3 21Z"/>
      </svg>
    </button>

    <div class="map-compass" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <circle cx="32" cy="32" r="26" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width=".7" opacity=".35"/>
        <path d="M32 8 37 30 32 26 27 30Z" fill="currentColor"/>
        <path d="M32 56 27 34 32 38 37 34Z" fill="currentColor" opacity=".35"/>
        <text x="32" y="7" font-size="8" text-anchor="middle" fill="currentColor" font-family="Georgia,serif">N</text>
      </svg>
    </div>

    <!-- Castle card -->
    <aside class="castle-card" id="castle-card" aria-live="polite" hidden>
      <button type="button" class="castle-card__close" id="castle-close" aria-label="Close">&times;</button>
      <div class="castle-card__body" id="castle-card-body"></div>
      <div class="castle-card__mission" id="castle-mission" hidden></div>
      <div class="castle-card__nav">
        <button type="button" class="castle-card__step" data-step="-1">&larr; Previous keep</button>
        <button type="button" class="castle-card__step" data-step="1">Next keep &rarr;</button>
      </div>
    </aside>

    <!-- Touch joystick -->
    <div class="map-stick" id="map-stick" aria-hidden="true"><span></span></div>
  </main>

  <!-- ── DOCUMENT VIEW ─────────────────────────────────────── -->
  <div class="doc-view" id="doc-view">
    <nav class="nav" id="nav">
      <a class="nav__brand" href="#home"></a>
      <ul class="nav__links" id="nav-links"></ul>
      <a href="cv.pdf" class="btn btn--outline nav__cv" download>Download CV</a>
      <button class="nav__burger" aria-label="Toggle menu" aria-expanded="false" id="burger">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div id="doc-root"></div>
  </div>

  <noscript>
    <div class="noscript">
      <h1>Andranik Grigoryan — DevOps Engineer</h1>
      <p>This portfolio renders from a JSON config and needs JavaScript.
         The full résumé is available as a <a href="cv.pdf">PDF</a>.</p>
    </div>
  </noscript>

  <!-- Shown after the world collapses. Deliberately the plain server page. -->
  <div class="error-500" id="error-500" hidden>
    <h1>500 Internal Server Error</h1>
    <hr />
    <p class="error-500__sig">andranik-grigoryan/1.0</p>
    <div class="error-500__actions">
      <button type="button" id="error-restart">Restart the campaign</button>
      <button type="button" data-goto="doc">Read the written record</button>
    </div>
  </div>

  <div class="boot-error" id="boot-error" hidden></div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
